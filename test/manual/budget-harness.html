<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Budget Planning — dev harness</title>
<link rel="stylesheet" href="../../variation-fee-calculator/assets/css/vcl-style.css" />
<link rel="stylesheet" href="../../variation-fee-calculator/assets/css/vcl-calc-style.css" />
<link rel="stylesheet" href="../../variation-fee-calculator/assets/css/vcl-budget-style.css?v=7" />
<style>
  body { margin: 0; padding: 24px; background: #EFEFEC; font-family: -apple-system, sans-serif; }
  .vclcalc-app { display: none; } /* real calculator markup kept only so vcl-calc-app.js has its DOM hooks */
  /* Harness-only: the real page puts Budget in column 2 of a 300px+1fr grid; with the calculator
     hidden that leaves an empty 300px column squeezing the tool. Let it span the full width here. */
  .vcl-app .layout { grid-template-columns: 1fr; }
  .vcl-app .budget-col { grid-column: 1; padding-right: 0; }
</style>
</head>
<body>
  <div class="vcl-app">
    <div class="layout">
      <div class="budget-col" id="vcl-budgetCol"></div>
      <div class="vclcalc-app" id="vclcalc-app">
        <div class="rail" id="vclcalc-rail"></div>
        <div id="vclcalc-stepContent"></div>
        <div class="src"><div class="fx-status-row"><span id="vclcalc-fxStatus"></span></div></div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-data.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-calc-data.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-calc-app.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-workload-data.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-workload-hours-data.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-workload-hours.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-sg-logic.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-submission.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-annual-data.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-budget-engine.js"></script>
  <script src="../../variation-fee-calculator/assets/js/vcl-budget.js?v=7"></script>
  <script>
    // Optional demo data for a quick populated preview: open ...budget-harness.html?demo=1
    // (seeds one grouping line). ?demo=3 seeds a three-line plan (Grouping / Grouping+WS / Single)
    // so the table styling -- zebra striping, hover, totals -- is visible with several rows.
    if (/[?&]demo=1/.test(location.search)) {
      localStorage.setItem("vcl_budget_plan_v2", JSON.stringify({ version: 2, hoursPerHead: 1600, lines: [{
        id: "line-demo", product: "Ibuprofen", quarter: "Q2", probability: 100,
        submission: { mode: null,
          variations: [{ code: null, variantId: null, type: "IB" }, { code: null, variantId: null, type: "II" }, { code: null, variantId: null, type: "IA" }],
          procedures: [{ kind: "mrpdcp", nat: null, rms: "DE", cms: ["BE", "LT", "LU", "HR", "CY", "DK", "EE"] }],
          lead: null, raTasks: { cmc: false, compilation: false, pi: false, piDocs: {}, activeSubstance: null },
          strengths: { default: 1, overrides: {} }, specials: { line: {}, ws: {}, lead: null } }
      }] }));
    }
    if (/[?&]demo=3/.test(location.search)) {
      localStorage.setItem("vcl_budget_plan_v2", JSON.stringify({ version: 2, hoursPerHead: 1520, lines: [
        { id: "line-a", product: "Ketamin 50 C Plus", year: 2027, quarter: "Q4", probability: 100,
          submission: { mode: null,
            variations: [{ code: null, variantId: null, type: "IB" }, { code: null, variantId: null, type: "IB" }, { code: null, variantId: null, type: "II" }, { code: null, variantId: null, type: "II" }],
            procedures: [{ kind: "mrpdcp", nat: null, rms: "DE", cms: ["BE", "LT", "LU", "HR", "CY", "DK", "EE", "AT"] }],
            lead: null, raTasks: { cmc: false, compilation: false, pi: false, piDocs: {}, activeSubstance: null },
            strengths: { default: 5, overrides: {} }, specials: { line: {}, ws: {}, lead: null } } },
        { id: "line-b", product: "Aspirin", year: 2027, quarter: "Q2", probability: 100,
          submission: { mode: null,
            variations: [{ code: null, variantId: null, type: "IB" }, { code: null, variantId: null, type: "IB" }, { code: null, variantId: null, type: "II" }],
            procedures: [{ kind: "mrpdcp", nat: null, rms: "FR", cms: ["BE", "LT", "LU", "HR", "CY", "DK", "EE", "AT", "IE"] }, { kind: "national", nat: "EL", countries: ["EL"] }, { kind: "national", nat: "DK", countries: ["DK"] }],
            lead: null, raTasks: { cmc: false, compilation: false, pi: false, piDocs: {}, activeSubstance: null },
            strengths: { default: 4, overrides: {} }, specials: { line: {}, ws: {}, lead: null } } },
        { id: "line-c", product: "Pantoprazol 40 mg", year: 2027, quarter: "Q1", probability: 100,
          submission: { mode: null,
            variations: [{ code: null, variantId: null, type: "IA" }, { code: null, variantId: null, type: "IA" }, { code: null, variantId: null, type: "IA" }],
            procedures: [{ kind: "national", nat: "DE", countries: ["DE"] }],
            lead: null, raTasks: { cmc: false, compilation: false, pi: false, piDocs: {}, activeSubstance: null },
            strengths: { default: 1, overrides: {} }, specials: { line: {}, ws: {}, lead: null } } }
      ] }));
    }
    window.VCL_BUDGET.render(document.getElementById("vcl-budgetCol"));
  </script>
</body>
</html>
