<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Fee data page harness</title>
<!--
  Drives the public fee-data page (appState.step === 'feedata') without a
  WordPress install: the .vclcalc-app scaffold below is a copy of the block
  vcl_lookup_shortcode() prints, plus the calculator heading the guide renders
  into #vcl-calcHead. Stylesheets and scripts are the real ones.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>body{margin:0;padding:26px;background:#eef1f4}.wrap{max-width:1240px;margin:0 auto}</style>
<script>
  var BUST = Date.now();
  ['vcl-style','vcl-workload-style','vcl-calc-style'].forEach(function (n) {
    document.write('<link rel="stylesheet" href="../../variation-fee-calculator/assets/css/' + n + '.css?v=' + BUST + '">');
  });
</script>
</head><body>
<div class="wrap vcl-app">
  <div class="classification-head classification-head--calc" id="vcl-calcHead"></div>
  <div class="vclcalc-app" id="vclcalc-app">
    <div class="rail" id="vclcalc-rail"></div>
    <div id="vclcalc-stepContent"></div>
    <div class="src"><div class="fx-status-row">
      <span id="vclcalc-fxStatus" style="font-family:var(--mono);font-size:11px"></span>
    </div></div>
  </div>
</div>
<script>
  document.write('<scr'+'ipt src="../../variation-fee-calculator/assets/js/vcl-calc-data.js?v='+BUST+'"></scr'+'ipt>');
  document.write('<scr'+'ipt src="../../variation-fee-calculator/assets/js/vcl-feedata.js?v='+BUST+'"></scr'+'ipt>');
  document.write('<scr'+'ipt src="../../variation-fee-calculator/assets/js/vcl-calc-app.js?v='+BUST+'"></scr'+'ipt>');
</script>
<script>
  // The guide normally prints this button; here it only has to reach the page.
  document.getElementById('vcl-calcHead').innerHTML =
    '<p class="calc-head-actions"><button type="button" class="calc-feedata-btn" id="vcl-calcFeeDataBtn">Fee data &mdash; country details</button></p>';
  document.getElementById('vcl-calcFeeDataBtn').addEventListener('click', function () {
    window.VCLCALC.openFeeData();
  });
  window.VCLCALC.openFeeData();
</script>
</body></html>
